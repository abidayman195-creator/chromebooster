
name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: unzip -q chromeboost-proyecto.zip -d proyecto

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Compilar
        working-directory: proyecto/chromeboost
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: chromeboost-jar
          path: proyecto/chromeboost/build/libs/*.jar
